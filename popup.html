<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Net Meter Plus</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --panel: #101722;
      --panel-strong: #151f2d;
      --panel-soft: #0d131d;
      --border: rgba(226, 232, 240, 0.1);
      --text: #f8fafc;
      --muted: #98a6b8;
      --soft: #cbd5e1;
      --accent: #22d3ee;
      --accent-2: #60a5fa;
      --accent-3: #34d399;
      --button-text: #041016;
      --danger: #fb7185;
      --shadow: 0 20px 48px rgba(0, 0, 0, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 398px;
      padding: 12px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #111827 0%, #07090d 100%);
    }

    .shell {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(180deg, #0e1521 0%, #090d14 100%);
      box-shadow: var(--shadow);
    }

    .header {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--button-text);
      background: linear-gradient(135deg, #dbeafe 0%, #67e8f9 52%, #34d399 100%);
      box-shadow: 0 12px 26px rgba(34, 211, 238, 0.18);
    }

    .brand-mark svg {
      width: 25px;
      height: 25px;
      stroke: currentColor;
      stroke-width: 2.6;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .state-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid rgba(52, 211, 153, 0.26);
      color: #bbf7d0;
      background: rgba(52, 211, 153, 0.08);
      font-size: 11px;
      font-weight: 800;
    }

    .state-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-3);
      box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.1);
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 9px;
      margin-bottom: 12px;
    }

    .info-card {
      min-width: 0;
      min-height: 58px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    .info-card.full {
      grid-column: 1 / -1;
      min-height: 54px;
    }

    .label {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .info-value {
      min-width: 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.25;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .gauge-card {
      margin-bottom: 12px;
      padding: 10px 12px 8px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(180deg, var(--panel-strong), var(--panel-soft));
    }

    .gauge-wrap {
      position: relative;
      height: 132px;
      overflow: hidden;
    }

    .gauge-svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 122px;
      overflow: visible;
    }

    .track,
    .progress {
      fill: none;
      stroke-width: 15;
      stroke-linecap: round;
    }

    .track {
      stroke: rgba(148, 163, 184, 0.18);
    }

    .progress {
      stroke: url(#gaugeGradient);
      transition: stroke-dashoffset 0.14s linear;
      filter: drop-shadow(0 8px 18px rgba(34, 211, 238, 0.2));
    }

    .gauge-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      display: grid;
      justify-items: center;
      text-align: center;
      pointer-events: none;
    }

    .gauge-kicker {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.1;
      font-weight: 800;
    }

    .gauge-number {
      max-width: 100%;
      color: var(--text);
      font-size: 40px;
      line-height: 0.95;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      font-weight: 850;
    }

    .gauge-unit {
      margin-top: 5px;
      color: var(--soft);
      font-size: 13px;
      font-weight: 800;
    }

    .gauge-scale {
      display: flex;
      justify-content: space-between;
      padding: 0 6px;
      color: rgba(203, 213, 225, 0.7);
      font-size: 11px;
      font-weight: 800;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin-bottom: 12px;
    }

    .metric {
      min-width: 0;
      min-height: 76px;
      padding: 10px 9px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
    }

    .metric:hover {
      transform: translateY(-1px);
    }

    .metric.active {
      border-color: rgba(34, 211, 238, 0.36);
      background: linear-gradient(180deg, rgba(34, 211, 238, 0.14), rgba(96, 165, 250, 0.08));
    }

    .metric-label {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.1;
      font-weight: 800;
    }

    .metric-value {
      margin-bottom: 4px;
      color: var(--text);
      font-size: 22px;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-unit {
      color: var(--soft);
      font-size: 11px;
      font-weight: 800;
    }

    .status-panel {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.035);
    }

    .status {
      min-height: 18px;
      color: var(--soft);
      font-size: 12px;
      line-height: 1.45;
      font-weight: 700;
    }

    .phase-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .phase {
      height: 5px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.18);
      overflow: hidden;
    }

    .phase.active,
    .phase.done {
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
    }

    .phase.done {
      background: var(--accent-3);
    }

    #runTest {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      padding: 0 16px;
      color: var(--button-text);
      background: linear-gradient(135deg, #ffffff 0%, #dbeafe 28%, #67e8f9 100%);
      box-shadow: 0 14px 28px rgba(34, 211, 238, 0.18);
      cursor: pointer;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 850;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    #runTest:hover {
      transform: translateY(-1px);
    }

    #runTest:disabled {
      opacity: 0.78;
      cursor: wait;
      transform: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="Net Meter Plus">
    <header class="header">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M4 15a8 8 0 0 1 16 0" />
          <path d="M7 15a5 5 0 0 1 10 0" />
          <path d="M12 15l5-7" />
          <path d="M12 15h.01" />
        </svg>
      </div>

      <div>
        <div class="title-row">
          <h1 class="title">Net Meter Plus</h1>
          <div class="state-pill">
            <span class="state-dot" aria-hidden="true"></span>
            <span id="readyState">Ready</span>
          </div>
        </div>
        <div class="subtitle">Cloudflare speed test</div>
      </div>
    </header>

    <section class="info-grid" aria-label="Сведения о подключении">
      <div class="info-card full">
        <div class="label">Сервер</div>
        <div id="serverValue" class="info-value">Cloudflare Edge</div>
      </div>

      <div class="info-card">
        <div class="label">IP</div>
        <div id="ipValue" class="info-value">—</div>
      </div>

      <div class="info-card">
        <div class="label">Страна</div>
        <div id="countryValue" class="info-value">—</div>
      </div>
    </section>

    <section class="gauge-card" aria-label="Текущая метрика">
      <div class="gauge-wrap">
        <svg class="gauge-svg" viewBox="0 0 320 170" aria-hidden="true">
          <defs>
            <linearGradient id="gaugeGradient" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#60a5fa"></stop>
              <stop offset="58%" stop-color="#22d3ee"></stop>
              <stop offset="100%" stop-color="#34d399"></stop>
            </linearGradient>
          </defs>
          <path id="gaugeTrack" class="track" d="M 42 132 A 118 118 0 0 1 278 132"></path>
          <path id="gaugeProgress" class="progress" d="M 42 132 A 118 118 0 0 1 278 132"></path>
        </svg>

        <div class="gauge-overlay">
          <div id="gaugeLabel" class="gauge-kicker">Входящая скорость</div>
          <div id="gaugeValue" class="gauge-number">—</div>
          <div id="gaugeUnit" class="gauge-unit">Mbps</div>
        </div>
      </div>

      <div class="gauge-scale" aria-hidden="true">
        <span id="scaleMin">0</span>
        <span id="scaleMid">500</span>
        <span id="scaleMax">1000</span>
      </div>
    </section>

    <section class="metrics" aria-label="Результаты теста">
      <button class="metric active" type="button" data-metric="download">
        <div class="metric-label">Входящая</div>
        <div id="downloadMetric" class="metric-value">—</div>
        <div class="metric-unit">Mbps</div>
      </button>

      <button class="metric" type="button" data-metric="upload">
        <div class="metric-label">Исходящая</div>
        <div id="uploadMetric" class="metric-value">—</div>
        <div class="metric-unit">Mbps</div>
      </button>

      <button class="metric" type="button" data-metric="ping">
        <div class="metric-label">Ping</div>
        <div id="pingMetric" class="metric-value">—</div>
        <div class="metric-unit">ms</div>
      </button>
    </section>

    <section class="status-panel" aria-live="polite">
      <div id="status" class="status">Готов к проверке.</div>
      <div class="phase-list" aria-hidden="true">
        <span class="phase" data-phase="meta"></span>
        <span class="phase" data-phase="download"></span>
        <span class="phase" data-phase="upload"></span>
        <span class="phase" data-phase="ping"></span>
      </div>
    </section>

    <button id="runTest" type="button">Проверить скорость</button>
  </main>

  <script src="popup.js"></script>
</body>
</html>
